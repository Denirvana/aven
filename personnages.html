<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personnages — Aven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--nav-h:56px;}
    html,body{width:100%;height:100%;overflow:hidden;background:#06060f;}
    .svg-defs{position:absolute;width:0;height:0;overflow:hidden}

    /* ══ NAVBAR (identique index) ══ */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);
      display:flex;align-items:center;justify-content:center;gap:3rem;
      background:rgba(6,6,15,.4);
      backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
      border-bottom:.5px solid rgba(255,255,255,.06);
    }
    nav a{
      font-family:'Raleway',sans-serif;font-weight:300;
      font-size:11px;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(255,255,255,.68);text-decoration:none;transition:color .3s;position:relative;
    }
    nav a[href="personnages.html"]{color:rgba(255,255,255,.95);}
    nav a[href="personnages.html"]::after{transform:scaleX(1)!important;}
    nav a::after{
      content:'';position:absolute;bottom:-3px;left:0;right:0;
      height:.5px;background:rgba(200,120,48,.8);
      transform:scaleX(0);transform-origin:center;transition:transform .35s ease;
    }
    nav a:hover{color:#fff;}
    nav a:hover::after{transform:scaleX(1);}

    /* ══ VINYL ZONE ══ */
    .vinyl-zone{
      position:fixed;right:18px;top:0;
      height:var(--nav-h);
      display:flex;align-items:center;gap:9px;
      z-index:201;
    }
    .track-info{display:flex;align-items:center;gap:6px;}
    #track-label{
      font-family:'Raleway',sans-serif;font-size:9px;font-weight:300;
      letter-spacing:.14em;text-transform:uppercase;
      color:rgba(255,255,255,.3);max-width:130px;
      overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:color .4s;
    }
    #track-label.on{color:rgba(200,120,48,.8);}
    .chevron-btn{
      background:none;border:none;cursor:pointer;padding:2px 4px;
      display:flex;align-items:center;opacity:.4;transition:opacity .2s;color:white;
    }
    .chevron-btn:hover{opacity:.9;}
    .chevron-btn svg{width:10px;height:10px;fill:currentColor;transition:transform .25s;}
    .chevron-btn.open svg{transform:rotate(180deg);}
    .vinyl{position:relative;width:40px;height:40px;cursor:pointer;flex-shrink:0;}
    .disc-wrap{
      width:40px;height:40px;border-radius:50%;overflow:hidden;
      transform-origin:center;
      animation:spin 4s linear infinite;animation-play-state:paused;transition:box-shadow .5s;
    }
    .vinyl.spinning .disc-wrap{animation-play-state:running;box-shadow:0 0 10px rgba(200,120,48,.5);}
    @keyframes spin{to{transform:rotate(360deg);}}
    .disc-wrap img,.disc-wrap svg.vinyl-svg{width:40px;height:40px;display:block;}
    .vinyl-icon{
      position:absolute;inset:0;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;
    }
    .vinyl:hover .vinyl-icon{opacity:1;}
    .vinyl-icon svg{width:13px;height:13px;fill:rgba(255,255,255,.92);}

    /* ══ POPUP VINYL ══ */
    #vinyl-popup{
      position:fixed;top:calc(var(--nav-h)+10px);right:14px;z-index:300;
      background:rgba(10,6,2,.9);border:.5px solid rgba(200,120,48,.35);border-radius:20px;
      padding:7px 14px;display:flex;align-items:center;gap:7px;white-space:nowrap;
      pointer-events:none;opacity:0;transform:translateY(-6px);
      transition:opacity .5s ease,transform .5s ease;
    }
    #vinyl-popup.visible{opacity:1;transform:translateY(0);}
    #vinyl-popup::before{
      content:'';position:absolute;bottom:100%;right:20px;
      border:5px solid transparent;border-bottom-color:rgba(200,120,48,.35);
    }
    #vinyl-popup::after{
      content:'';position:absolute;bottom:calc(100% - 1px);right:21px;
      border:4px solid transparent;border-bottom-color:rgba(10,6,2,.9);
    }
    .popup-dot{
      width:6px;height:6px;border-radius:50%;background:rgba(200,120,48,.85);flex-shrink:0;
      animation:dotPulse 1.6s ease-in-out infinite;
    }
    @keyframes dotPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
    .popup-text{
      font-family:'Raleway',sans-serif;font-size:9px;font-weight:300;
      letter-spacing:.18em;text-transform:uppercase;color:rgba(200,120,48,.85);
    }

    /* ══ DROPDOWN ══ */
    .dropdown{
      position:fixed;top:calc(var(--nav-h)+6px);right:16px;width:220px;z-index:400;
      background:rgba(8,8,20,.88);
      backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
      border:.5px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden;
      opacity:0;transform:translateY(-8px);pointer-events:none;
      transition:opacity .22s ease,transform .22s ease;
    }
    .dropdown.open{opacity:1;transform:translateY(0);pointer-events:all;}
    .dropdown-header{
      padding:10px 14px 8px;
      font-family:'Raleway',sans-serif;font-size:8px;letter-spacing:.18em;text-transform:uppercase;
      color:rgba(255,255,255,.25);border-bottom:.5px solid rgba(255,255,255,.06);
    }
    .track-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .15s;}
    .track-item:hover{background:rgba(255,255,255,.05);}
    .track-item.active{background:rgba(200,120,48,.08);}
    .track-thumb{width:26px;height:26px;border-radius:4px;overflow:hidden;flex-shrink:0;}
    .track-thumb img{width:26px;height:26px;display:block;}
    .track-meta{flex:1;min-width:0;}
    .track-title{
      font-family:'Raleway',sans-serif;font-size:10px;
      color:rgba(255,255,255,.75);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    }
    .track-item.active .track-title{color:rgba(200,120,48,.95);}
    .playing-dot{
      width:5px;height:5px;border-radius:50%;background:rgba(200,120,48,.9);
      flex-shrink:0;opacity:0;animation:blink 1.4s ease-in-out infinite;
    }
    .track-item.active .playing-dot{opacity:1;}
    @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}

    /* ══ PAGE LAYOUT ══ */
    .page{
      position:fixed;inset:0;top:var(--nav-h);
      overflow:hidden;
    }

    /* ══ FOND ATMOSPHÉRIQUE (statique, aberration) ══ */
    .page-bg{position:absolute;inset:0;pointer-events:none;}
    .bg-grad{
      position:absolute;inset:0;
      background:linear-gradient(160deg,
        #040410 0%,#080618 18%,#0e0a22 32%,
        #140c1e 46%,#1a0e18 60%,#0e0810 80%,#040408 100%);
    }
    .bg-layer{
      position:absolute;inset:0;
      opacity:.65;mix-blend-mode:screen;
      -webkit-mask-image:radial-gradient(ellipse 88% 84% at 50% 50%,transparent 35%,rgba(0,0,0,.6) 60%,black 82%);
      mask-image:        radial-gradient(ellipse 88% 84% at 50% 50%,transparent 35%,rgba(0,0,0,.6) 60%,black 82%);
    }
    .bg-r{filter:url(#ca-red);}
    .bg-b{filter:url(#ca-blue);}
    .bg-r .bg-grad,.bg-b .bg-grad{
      position:absolute;inset:0;
      background:linear-gradient(160deg,
        #040410 0%,#080618 18%,#0e0a22 32%,
        #140c1e 46%,#1a0e18 60%,#0e0810 80%,#040408 100%);
    }
    .vignette{
      position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 30%,rgba(2,2,8,.55) 65%,rgba(2,2,8,.9) 100%);
    }
    .edge-blur{
      position:absolute;inset:0;pointer-events:none;
      backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
      -webkit-mask-image:radial-gradient(ellipse 74% 70% at 50% 50%,transparent 32%,rgba(0,0,0,.5) 55%,black 78%);
      mask-image:        radial-gradient(ellipse 74% 70% at 50% 50%,transparent 32%,rgba(0,0,0,.5) 55%,black 78%);
    }

    /* ══ CONTENU SCROLLABLE ══ */
    .page-content{
      position:absolute;inset:0;
      overflow-y:auto;overflow-x:hidden;
      padding:48px 60px 80px;
      scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;
    }
    .page-content::-webkit-scrollbar{width:4px;}
    .page-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

    .page-title{
      font-family:'Cinzel',serif;font-weight:700;
      font-size:clamp(28px,3.5vw,46px);letter-spacing:.18em;
      color:#fff;margin-bottom:6px;
      text-shadow:0 0 60px rgba(200,120,48,.3);
    }
    .page-subtitle{
      font-family:'Raleway',sans-serif;font-weight:200;
      font-size:11px;letter-spacing:.3em;text-transform:uppercase;
      color:rgba(255,255,255,.35);margin-bottom:24px;
    }

    /* ══ FILTRE ══ */
    .filter-bar{
      display:flex;flex-wrap:wrap;gap:7px;
      max-width:1100px;margin-bottom:32px;
    }
    .filter-btn{
      font-family:'Raleway',sans-serif;font-size:9px;font-weight:400;
      letter-spacing:.14em;text-transform:uppercase;
      padding:5px 13px;border-radius:999px;cursor:pointer;
      border:.5px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);color:rgba(255,255,255,.45);
      transition:background .2s,border-color .2s,color .2s;
    }
    .filter-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);}
    .filter-btn.active{
      background:rgba(200,120,48,.18);border-color:rgba(200,120,48,.5);
      color:rgba(220,150,70,.95);
    }
    .filter-btn.all.active{
      background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);
      color:rgba(255,255,255,.85);
    }

    /* ══ GROUPE ══ */
    .char-group{ max-width:1100px; margin-bottom:40px; }
    .char-group-label{
      font-family:'Raleway',sans-serif;font-weight:200;
      font-size:9px;letter-spacing:.32em;text-transform:uppercase;
      color:rgba(255,255,255,.18);margin-bottom:14px;
      padding-bottom:8px;border-bottom:.5px solid rgba(255,255,255,.05);
    }
    .char-group.hidden{ display:none; }

    /* ══ GRILLE DE CARDS ══ */
    .chars-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
      gap:16px;
    }

    /* ══ CARD PERSONNAGE ══ */
    .char-card{
      position:relative;border-radius:8px;overflow:hidden;
      cursor:pointer;
      border:.5px solid rgba(255,255,255,.07);
      aspect-ratio:3/4;
      transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .3s;
    }
    .char-card:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.15);}
    .char-card-img{
      position:absolute;inset:0;background-size:cover;background-position:top center;
      transition:transform .6s cubic-bezier(.22,1,.36,1),filter .4s;
      filter:brightness(.6) saturate(.85);
    }
    .char-card:hover .char-card-img{transform:scale(1.05);filter:brightness(.75) saturate(1);}
    .char-card-overlay{
      position:absolute;inset:0;
      background:linear-gradient(to top,rgba(4,4,14,.92) 0%,rgba(4,4,14,.3) 45%,transparent 70%);
    }
    .char-card-body{
      position:absolute;bottom:0;left:0;right:0;padding:16px 18px;
    }
    .char-card-name{
      font-family:'Cinzel',serif;font-weight:600;
      font-size:20px;letter-spacing:.1em;color:#fff;
      text-shadow:0 2px 10px rgba(0,0,0,.6);margin-bottom:4px;
    }
    .char-card-title{
      font-family:'Raleway',sans-serif;font-weight:300;
      font-size:9px;letter-spacing:.2em;text-transform:uppercase;
      color:rgba(255,255,255,.45);margin-bottom:10px;
    }
    .char-card-tags{display:flex;flex-wrap:wrap;gap:4px;}
    .ctag{
      font-family:'Raleway',sans-serif;font-size:8px;font-weight:400;
      letter-spacing:.08em;text-transform:uppercase;
      padding:3px 8px;border-radius:999px;
    }
    .ctag-amber{background:rgba(200,100,20,.2);color:rgba(220,150,60,.9);border:.5px solid rgba(200,100,20,.3);}
    .ctag-coral{background:rgba(180,60,30,.2);color:rgba(220,100,70,.9);border:.5px solid rgba(180,60,30,.3);}
    .ctag-gray {background:rgba(120,115,110,.15);color:rgba(180,175,170,.8);border:.5px solid rgba(120,115,110,.25);}
    .ctag-pink {background:rgba(160,40,80,.2);color:rgba(210,100,140,.9);border:.5px solid rgba(160,40,80,.3);}
    .ctag-blue {background:rgba(40,80,160,.2);color:rgba(100,150,220,.9);border:.5px solid rgba(40,80,160,.3);}

    /* ══ MODAL — PANNEAU LATÉRAL ══ */
    #modal-backdrop{
      position:fixed;inset:0;z-index:500;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
      opacity:0;pointer-events:none;
      transition:opacity .4s ease;
    }
    #modal-backdrop.open{opacity:1;pointer-events:all;}

    #char-panel{
      position:fixed;top:0;right:0;bottom:0;z-index:600;
      width:min(62vw,780px);
      background:rgba(7,7,18,.97);
      border-left:.5px solid rgba(255,255,255,.07);
      transform:translateX(100%);
      transition:transform .45s cubic-bezier(.22,1,.36,1);
      display:flex;flex-direction:column;
      overflow:hidden;
    }
    #char-panel.open{transform:translateX(0);}

    /* Header du panneau */
    .panel-header{
      flex-shrink:0;
      padding:28px 32px 20px;
      border-bottom:.5px solid rgba(255,255,255,.06);
      background:rgba(6,6,16,.6);
      display:flex;flex-direction:column;gap:0;
    }
    .panel-close{
      position:absolute;top:18px;right:20px;
      background:none;border:none;cursor:pointer;
      color:rgba(255,255,255,.35);transition:color .2s;
      font-size:20px;line-height:1;padding:4px 8px;
    }
    .panel-close:hover{color:rgba(255,255,255,.7);}
    .panel-char-name{
      font-family:'Cinzel',serif;font-weight:700;
      font-size:clamp(26px,3vw,38px);letter-spacing:.18em;color:#fff;line-height:1;
      text-shadow:0 0 40px rgba(200,120,48,.25);
    }
    .panel-char-title{
      font-family:'Raleway',sans-serif;font-weight:300;
      font-size:11px;letter-spacing:.28em;text-transform:uppercase;
      color:rgba(255,255,255,.35);margin-top:8px;
    }
    .panel-char-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;}

    /* Avatar du personnage dans le header */
    .panel-header-top{display:flex;align-items:center;gap:18px;}
    .panel-avatar{
      width:62px;height:62px;border-radius:50%;overflow:hidden;flex-shrink:0;
      border:.5px solid rgba(255,255,255,.12);
    }
    .panel-avatar img,.panel-avatar svg{width:62px;height:62px;display:block;object-fit:cover;}
    .panel-header-text{flex:1;min-width:0;}

    /* Corps scrollable du panneau */
    .panel-body{
      flex:1;overflow-y:auto;overflow-x:hidden;
      padding:0;
      scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent;
    }
    .panel-body::-webkit-scrollbar{width:3px;}
    .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}

    /* ══ SECTIONS PLIABLES ══ */
    .cs-section{border-bottom:.5px solid rgba(255,255,255,.05);}

    .cs-section-header{
      width:100%;background:none;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:space-between;
      padding:15px 32px;
      font-family:'Cinzel',serif;font-weight:400;
      font-size:14px;letter-spacing:.1em;
      color:rgba(255,255,255,.55);
      transition:color .25s,background .2s;
      text-align:left;
    }
    .cs-section-header:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.02);}
    .cs-section-header.open{color:rgba(255,255,255,.9);}

    .cs-chevron{
      width:14px;height:14px;flex-shrink:0;
      stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;
      transition:transform .35s cubic-bezier(.22,1,.36,1);opacity:.6;
    }
    .cs-section-header.open .cs-chevron{transform:rotate(180deg);opacity:1;}

    /* Trick grid-template-rows pour animation hauteur propre */
    .cs-section-wrap{
      display:grid;grid-template-rows:0fr;
      transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1);
    }
    .cs-section-wrap.open{grid-template-rows:1fr;}
    .cs-section-body{overflow:hidden;}
    .cs-section-inner{padding:0 32px 22px;}

    /* ══ CONTENU DES SECTIONS ══ */
    .info-grid{
      display:grid;grid-template-columns:1fr 1fr;
      border:.5px solid rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-top:4px;
    }
    .info-field{
      padding:10px 13px;border-bottom:.5px solid rgba(255,255,255,.05);border-right:.5px solid rgba(255,255,255,.05);
    }
    .info-field:nth-child(even){border-right:none;}
    .info-field:nth-last-child(1),.info-field:nth-last-child(2){border-bottom:none;}
    .info-field.full{grid-column:1/-1;border-right:none;}
    .info-label{
      font-family:'Raleway',sans-serif;font-size:9px;font-weight:400;
      letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:4px;
    }
    .info-value{
      font-family:'DM Sans',sans-serif;font-size:13px;color:rgba(255,255,255,.78);line-height:1.45;
    }
    .info-value.unknown{color:rgba(255,255,255,.25);font-style:italic;}

    /* Titre de sous-section dans le tableau info */
    .info-section-title{
      font-family:'Cinzel',serif;font-weight:400;font-size:12px;letter-spacing:.1em;
      color:rgba(255,255,255,.5);margin-top:14px;margin-bottom:6px;
      padding-bottom:5px;border-bottom:.5px solid rgba(255,255,255,.06);
    }
    .info-section-title:first-child{margin-top:0;}

    /* Bullets magie */
    .magic-list{display:flex;flex-direction:column;gap:14px;margin-top:4px;}
    .magic-item{display:flex;gap:12px;}
    .magic-dot{
      width:5px;height:5px;border-radius:50%;background:rgba(200,100,48,.8);
      flex-shrink:0;margin-top:7px;
    }
    .magic-content{}
    .magic-title{
      font-family:'Raleway',sans-serif;font-size:12px;font-weight:500;
      color:rgba(255,255,255,.88);margin-bottom:4px;
    }
    .magic-desc{
      font-family:'DM Sans',sans-serif;font-size:13px;
      color:rgba(255,255,255,.52);line-height:1.7;
    }

    /* ── Pupille Divine (marquage) ── */
    .divine-eye-block{
      border:.5px solid rgba(200,120,48,.2);border-radius:7px;
      background:rgba(200,120,48,.04);overflow:hidden;margin-bottom:14px;
    }
    .divine-eye-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 14px;border-bottom:.5px solid rgba(200,120,48,.12);
    }
    .divine-eye-title{
      font-family:'Raleway',sans-serif;font-size:11px;font-weight:500;
      letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8);
    }
    .divine-eye-deity{
      font-family:'Cinzel',serif;font-size:13px;letter-spacing:.1em;
      color:rgba(200,120,48,.85);
    }
    .divine-eye-body{
      display:flex;gap:14px;align-items:flex-start;padding:12px 14px;
    }
    .divine-eye-img{
      width:72px;height:72px;border-radius:6px;flex-shrink:0;overflow:hidden;
      border:.5px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.04);
      display:flex;align-items:center;justify-content:center;
    }
    .divine-eye-img img{width:100%;height:100%;object-fit:cover;}
    .divine-eye-img-placeholder{
      font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.06em;
      color:rgba(255,255,255,.2);text-align:center;padding:6px;line-height:1.4;
    }
    .divine-eye-desc{
      font-family:'DM Sans',sans-serif;font-size:12.5px;
      color:rgba(255,255,255,.5);line-height:1.72;flex:1;
    }

    /* ── Description avec image ── */
    .desc-with-image{
      display:flex;gap:18px;align-items:flex-start;margin-top:4px;
    }
    .desc-char-img{
      width:100px;flex-shrink:0;border-radius:6px;overflow:hidden;
      border:.5px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.03);
      aspect-ratio:2/3;
      display:flex;align-items:center;justify-content:center;
    }
    .desc-char-img img{width:100%;height:100%;object-fit:cover;}
    .desc-char-img-ph{

    .cs-text p:last-child{margin:0;}

      position:relative;display:flex;align-items:flex-start;
      padding:0 4px 28px;overflow-x:auto;

    }
    .timeline-track::-webkit-scrollbar{height:3px;}
    .timeline-track::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
    /* Ligne horizontale */
    .timeline-track::before{
      content:'';position:absolute;top:16px;left:0;right:0;height:.5px;
      background:linear-gradient(to right,transparent,rgba(255,255,255,.12) 5%,rgba(255,255,255,.12) 95%,transparent);
    }

    .tl-point:hover{opacity:.8;}
    .tl-dot{
      width:13px;height:13px;border-radius:50%;margin-top:10px;
      border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);
      transition:border-color .25s,background .25s,box-shadow .25s;flex-shrink:0;
    }
    .tl-point.active .tl-dot{

<script>
/* ══ COVERS ══ */
function makeCover(c1,c2){
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <polygon points='0,0 100,0 0,100' fill='${c1}'/>
      <polygon points='100,0 100,100 0,100' fill='${c2}'/>
    </svg>`);
}

/* ══ PISTES (identique index.html) ══ */
const tracks=[
  {title:'Aube sur la Montagne',src:null,cover:makeCover('#c84030','#e8a020')},
  {title:'Le Désert de Sel',    src:null,cover:makeCover('#1a3a8c','#7a20c8')},
  {title:'Nuit à Albarossa',   src:null,cover:makeCover('#0e4a2e','#1e6888')},
];

/* ════════════════════════════════════════════════════════════════════════════
   ██  GUIDE — PERSONNAGES  ██
   ════════════════════════════════════════════════════════════════════════════

   ── 1. AJOUTER UN PERSONNAGE ─────────────────────────────────────────────
   Copier ce template dans `characters` ou `extraChars`, remplir les champs,
   puis ajouter son id dans le bon groupe (section 3 ci-dessous).

   {
     id: 'mon-perso',          // Identifiant unique, minuscules, sans espace
     name: 'Nom Affiché',
     title: 'Le Rôle',

     // Avatar circulaire dans le header du panneau.
     // Option A (placeholder SVG) : makeAvatar('#couleur1','#couleur2','AB')
     // Option B (vraie image)     : avatar: '<img src="img/perso.jpg"/>'
     get avatar(){ return makeAvatar('#080818','#1a1040','Ab'); },

     // Tags affichés sur la card et dans le panneau.
     // Styles disponibles : 'amber' | 'coral' | 'gray' | 'pink' | 'blue'
     tags: [
       {label:'Mon Tag',   style:'amber'},
       {label:'Autre Tag', style:'blue'},
     ],

     // Fond de la card (en attendant une vraie image).
     // Pour une vraie image : cardBg: "url('img/perso.jpg') center/cover"
     cardBg: `linear-gradient(to bottom, #050510 0%, #0c0820 60%, #06040e 100%)`,

     // Décor SVG optionnel sur la card (peut être '' pour rien).
     cardSvg: '',

     // Sections du panneau latéral.
     // Chaque section est un onglet dépliable.
     sections: [
       {
         id:'info', title:'Informations', open:true,   // open:true = ouvert par défaut
         render:()=>`
         <div class="info-grid">
           ${field('Full name',  'Nom Affiché')}
           ${field('Age',        '— ans')}
           ${field('Gender',     '—')}
           ${field('Race',       '—')}
           ${field('Birth place','—', true)}   // true = champ grisé "non renseigné"
           ${field('Birthday',   '—', true)}
           ${field('Sexuality',  '—', true)}
           ${field('Role',       '—')}
           ${field('Likes',      '—', true)}
           ${field('Dislikes',   '—', true)}
           ${fieldFull('Hobbies','—', true)}   // fieldFull = occupe les 2 colonnes
         </div>`
       },

       // ── Section texte libre ──────────────────────────────────────────
       {
         id:'background', title:'Background story', open:false,
         render:()=>`
         <div class="cs-text">
           <p>Premier paragraphe.</p>
           <p>Deuxième paragraphe.</p>
         </div>`
       },

       // ── Section avec bullets (magic-list) ───────────────────────────
       {
         id:'magic', title:'Magic', open:false,
         render:()=>`
         <div class="magic-list">
           <div class="magic-item">
             <div class="magic-dot"></div>
             <div class="magic-content">
               <div class="magic-title">Titre du pouvoir</div>
               <div class="magic-desc">Description du pouvoir.</div>
             </div>
           </div>
         </div>`
       },

       // ── Section relations ────────────────────────────────────────────
       // relationBlockHtml(id_cible, 'Rôle · Descriptif', `<p>Texte.</p>`)
       // L'id_cible doit correspondre à un id de personnage existant.
       {
         id:'relations', title:'Relations', open:false,
         render:()=>
           relationBlockHtml('hyuun','Rôle de la relation',`
             <p>Description de la relation.</p>
           `)
       },
     ]
   }

   ── 2. STYLES DE TAGS ────────────────────────────────────────────────────
   'amber' → orange/doré      → rôles narratifs, armes
   'coral' → rouge/corail     → antagonistes, combattants, factions ennemies
   'gray'  → gris neutre      → rôles secondaires, arcs, lieux
   'pink'  → rose/mauve       → liens affectifs, secrets, révélations
   'blue'  → bleu             → factions alliées (ex: Filles d'Hadès)

   ── 3. GROUPES & CATÉGORIES ──────────────────────────────────────────────
   Les groupes définissent l'ordre d'affichage et les sections visuelles.
   Ajouter l'id du personnage dans le tableau `ids` du bon groupe.
   Pour créer un nouveau groupe, ajouter un objet dans `groups` :

   { id:'mon-groupe', label:'Nom du Groupe', ids:['id1','id2','id3'] }

   Le filtre en haut de page est généré automatiquement à partir des tags.
   Pas besoin de le modifier manuellement.

   ── 4. AVATAR AVEC VRAIE IMAGE ───────────────────────────────────────────
   Dans la définition du personnage, remplacer `get avatar()` par :
   avatar: '<img src="img/perso-avatar.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>',

   ── 5. CARD AVEC VRAIE IMAGE ─────────────────────────────────────────────
   Dans la définition du personnage, remplacer cardBg par :
   cardBg: "url('img/perso-card.jpg') center/cover",
   Et mettre cardSvg: '' (vide).

   ════════════════════════════════════════════════════════════════════════════ */

/* ══ DONNÉES PERSONNAGES ══ */
const characters=[
  {
    id:'hyuun',
    name:'Hyuun',
    title:'Le Loup',
    /* avatar: remplacer makeAvatar() par 'img/hyuun-avatar.jpg' quand prêt */
    get avatar(){ return makeAvatar('#3a0808','#8a1808','H'); },
    tags:[
      {label:'Protagoniste',style:'coral'},
      {label:'Marqué — Scylla',style:'amber'},
      {label:'Chasseur',style:'gray'},
    ],
    /* Image de card — remplacer par url('img/hyuun.jpg') */
    cardBg:`linear-gradient(to bottom, #0e0408 0%, #200808 30%, #3a1004 55%, #4a1808 75%, #1a0804 100%)`,
    cardSvg:`<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:.35">
      <line x1="80" y1="140" x2="140" y2="200" stroke="rgba(200,60,20,.6)" stroke-width="2"/>

function field(label,value,unknown=false){
  return `<div class="info-field">
    <div class="info-label">${label}</div>
    <div class="info-value${unknown?' unknown':''}">${value}</div>
  </div>`;
}
function fieldFull(label,value,unknown=false){
  return `<div class="info-field full">
    <div class="info-label">${label}</div>
    <div class="info-value${unknown?' unknown':''}">${value}</div>
  </div>`;
}
function tagHtml(t){ return `<span class="ctag ctag-${t.style}">${t.label}</span>`; }

   infoGrid(fields_html)
     Wraps des field() / fieldFull() dans une grille.
     Usage : infoGrid( field('Age','18') + field('Genre','Homme') )

   infoSection(title, fields_html)
     Même chose mais avec un titre de sous-section au-dessus.
     Usage : infoSection('Mieux le Connaître', field('Likes','—',true) + ...)

   divineEye(deity, imgSrc, desc)
     Bloc "Pupille Divine" pour un personnage marqué.
     deity  : nom de la divinité (ex: 'Scylla')
     imgSrc : chemin vers l'image de la pupille, ou '' pour placeholder
     desc   : description texte du marqueur

   descWithImage(imgSrc, paragraphsHtml)
     Description avec image du personnage sur la gauche.
     imgSrc : chemin vers l'image, ou '' pour placeholder
     paragraphsHtml : balises <p>...</p>

   buildTimeline(events)
     Timeline cliquable. events = tableau d'objets :
     {
       label:   'Nom du point' (court, affiché sous le dot),
       title:   'Titre complet affiché dans le bloc',
       event:   'Texte décrivant ce qui se passe (1–2 phrases)',
       dev:     'Texte sur le développement du personnage',
       linked:  ['id1','id2']  — ids de personnages liés (optionnel)
     }
   ════════════════════════════════════════════════════════════════════ */

function infoGrid(fieldsHtml){
  return `<div class="info-grid">${fieldsHtml}</div>`;
}
function infoSection(title, fieldsHtml){
  return `<p class="info-section-title">${title}</p><div class="info-grid">${fieldsHtml}</div>`;
}

function divineEye(deity, imgSrc='', desc=''){
  const imgHtml = imgSrc
    ? `<img src="${imgSrc}" alt="Pupille divine"/>`
    : `<div class="divine-eye-img-placeholder">Image de la<br>pupille<br>·</div>`;
  return `<div class="divine-eye-block">
    <div class="divine-eye-header">
      <span class="divine-eye-title">Pupille Divine</span>
      <span class="divine-eye-deity">${deity}</span>
    </div>
    <div class="divine-eye-body">
      <div class="divine-eye-img">${imgHtml}</div>
      <div class="divine-eye-desc">${desc}</div>
    </div>
  </div>`;
}

function descWithImage(imgSrc='', paragraphsHtml=''){
  const imgHtml = imgSrc
    ? `<img src="${imgSrc}" alt=""/>`
    : `<div class="desc-char-img-ph">Image<br>du personnage<br>·</div>`;
  return `<div class="desc-with-image">
    <div class="desc-char-img">${imgHtml}</div>
    <div class="desc-text">${paragraphsHtml}</div>
  </div>`;
}

function buildTimeline(events){
  if(!events||!events.length) return '';
  /* Génère un id unique pour cette timeline (plusieurs persos peuvent en avoir) */
  const uid = 'tl_'+Math.random().toString(36).slice(2,7);
  const dots = events.map((e,i)=>`
    <div class="tl-point${i===0?' active':''}" data-tl="${uid}" data-idx="${i}" onclick="tlClick('${uid}',${i})">
      <div class="tl-dot"></div>
      <span class="tl-label">${e.label}</span>
    </div>`).join('');

  /* Pré-render tous les blocs de contenu, cachés sauf le premier */
  const contents = events.map((e,i)=>{
    const linkedHtml = (e.linked&&e.linked.length)
      ? `<div class="tl-linked">
          <span class="tl-linked-label">Liés</span>
          ${e.linked.map(lid=>{
            const lc = charById[lid];
            if(!lc) return '';
            return `<div class="tl-linked-char" onclick="openPanel(charById['${lid}'])">
              <div class="tl-linked-avatar">${lc.avatar}</div>
              <span class="tl-linked-name">${lc.name}</span>
            </div>`;
          }).join('')}
        </div>`
      : '';
    return `<div class="timeline-content" data-tl-content="${uid}" data-idx="${i}"
        style="${i!==0?'display:none':''}">
      <div class="tl-event-title">${e.title||e.label}</div>
      ${e.event?`<div class="tl-event-body">${e.event}</div>`:''}
      ${e.dev?`<p class="tl-dev-label">Développement du personnage</p>
               <div class="tl-dev-body">${e.dev}</div>`:''}
      ${linkedHtml}
    </div>`;
  }).join('');

  return `<div class="timeline-wrap">
    <div class="timeline-track">${dots}</div>
    <div id="tlc_${uid}">${contents}</div>
  </div>`;
}

/* Appelé par les points de la timeline */
function tlClick(uid, idx){
  /* Dots */
  document.querySelectorAll(`[data-tl="${uid}"]`).forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
  });
  /* Contenus */
  document.querySelectorAll(`[data-tl-content="${uid}"]`).forEach((el,i)=>{
    el.style.display = i===idx ? '' : 'none';
  });
}

/* Avatar SVG placeholder — remplacer par <img src="..."> dans characters[].avatar */
function makeAvatar(c1,c2,initials='?'){
  return `<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="30" fill="url(#ag${initials})"/>
    <defs><radialGradient id="ag${initials}" cx="35%" cy="30%">
      <stop offset="0%" stop-color="${c1}"/>
      <stop offset="100%" stop-color="${c2}"/>
    </radialGradient></defs>
    <text x="30" y="36" text-anchor="middle" font-family="serif" font-size="18"
      fill="rgba(255,255,255,.85)" letter-spacing="1">${initials}</text>
  </svg>`;
}

/* Lookup rapide : id → character (pour les liens de relation) */
const charById=allCharsById;

/* Rendu d'un bloc relation avec mini-avatar cliquable */
function relationBlockHtml(charId, role, bodyHtml){
  const target=charById[charId];
  const avatarHtml=target
    ? `<div class="rel-avatar">${target.avatar}</div>`
    : '';
  const nameHtml=target
    ? `<span class="relation-name">${target.name}</span>`
    : `<span class="relation-name">${charId}</span>`;

  return `<div class="relation-block">
    <div class="relation-header">
      <a class="rel-link" href="#" onclick="openPanel(charById['${charId}']);return false;">
        ${avatarHtml}
        <div class="rel-meta">
          ${nameHtml}
          <span class="relation-role">${role}</span>
        </div>
      </a>
    </div>
    <div class="relation-body">${bodyHtml}</div>
  </div>`;
}

/* ══ BUILD FILTRES + GROUPES + CARDS ══ */
const filterBar    = document.getElementById('filter-bar');
const groupsCont   = document.getElementById('groups-container');

/* Collecte tous les labels de tags uniques */
const allTags=[];
const tagSeen=new Set();
groups.forEach(g=>{
  g.ids.forEach(id=>{
    const ch=charById[id];
    if(!ch) return;
    ch.tags.forEach(t=>{
      if(!tagSeen.has(t.label)){ tagSeen.add(t.label); allTags.push(t); }
    });
  });
});

let activeFilter=null; // null = tout afficher

/* Bouton "Tous" */
const btnAll=document.createElement('button');
btnAll.className='filter-btn all active';
btnAll.textContent='Tous';
btnAll.addEventListener('click',()=>{ activeFilter=null; applyFilter(); setActiveBtn(btnAll); });
filterBar.appendChild(btnAll);

const filterBtns=[btnAll];
allTags.forEach(t=>{
  const btn=document.createElement('button');
  btn.className=`filter-btn`;
  btn.textContent=t.label;
  btn.addEventListener('click',()=>{
    if(activeFilter===t.label){ activeFilter=null; setActiveBtn(btnAll); }
    else{ activeFilter=t.label; setActiveBtn(btn); }
    applyFilter();
  });
  filterBar.appendChild(btn);
  filterBtns.push(btn);
});

function setActiveBtn(target){
  filterBtns.forEach(b=>b.classList.toggle('active',b===target));
}

/* Build groupes */
const groupEls={};
groups.forEach(g=>{
  const groupEl=document.createElement('div');
  groupEl.className='char-group';
  groupEl.dataset.groupId=g.id;
  groupEl.innerHTML=`<div class="char-group-label">${g.label}</div>`;
  const grid=document.createElement('div');
  grid.className='chars-grid';
  g.ids.forEach(id=>{
    const ch=charById[id];
    if(!ch) return;
    const card=document.createElement('div');
    card.className='char-card';
    card.dataset.tags=ch.tags.map(t=>t.label).join('|');
    card.innerHTML=`
      <div class="char-card-img" style="background:${ch.cardBg};">${ch.cardSvg||''}</div>
      <div class="char-card-overlay"></div>
      <div class="char-card-body">
        <div class="char-card-name">${ch.name}</div>
        <div class="char-card-title">${ch.title}</div>
        <div class="char-card-tags">${ch.tags.map(tagHtml).join('')}</div>
      </div>`;
    card.addEventListener('click',()=>openPanel(ch));
    grid.appendChild(card);
  });
  groupEl.appendChild(grid);
  groupsCont.appendChild(groupEl);
  groupEls[g.id]=groupEl;
});

function applyFilter(){
  groups.forEach(g=>{
    const groupEl=groupEls[g.id];
    if(!groupEl) return;
    const cards=groupEl.querySelectorAll('.char-card');
    let anyVisible=false;
    cards.forEach(card=>{
      const tags=card.dataset.tags.split('|');
      const show=!activeFilter||tags.includes(activeFilter);
      card.style.display=show?'':'none';
      if(show) anyVisible=true;
    });
    groupEl.classList.toggle('hidden',!anyVisible);
  });
}

/* ══ PANNEAU LATÉRAL ══ */
const backdrop=document.getElementById('modal-backdrop');
const panel   =document.getElementById('char-panel');
const pName   =document.getElementById('panel-name');
const pTitle  =document.getElementById('panel-title');
const pTags   =document.getElementById('panel-tags');
const pBody   =document.getElementById('panel-body');

function openPanel(ch){
  if(!ch) return;
  document.getElementById('panel-avatar').innerHTML=ch.avatar;
  pName.textContent=ch.name;
  pTitle.textContent=ch.title;
  pTags.innerHTML=ch.tags.map(tagHtml).join('');
  pBody.innerHTML='';
  ch.sections.forEach(sec=>{
    const wrap=document.createElement('div');
    wrap.className='cs-section';
    wrap.innerHTML=`
      <button class="cs-section-header${sec.open?' open':''}" onclick="toggleSection(this)">
        <span>${sec.title}</span>
        <svg class="cs-chevron" viewBox="0 0 14 8"><path d="M1 1l6 6 6-6"/></svg>
      </button>
      <div class="cs-section-wrap${sec.open?' open':''}">
        <div class="cs-section-body">
          <div class="cs-section-inner">${sec.render()}</div>
        </div>
      </div>`;
    pBody.appendChild(wrap);
  });
  backdrop.classList.add('open');
  panel.classList.add('open');
  document.body.style.overflow='hidden';
  /* Injecte les mini-avatars dans les blocs relation */
  requestAnimationFrame(()=>{
    panel.querySelectorAll('[id^="rel-av-"]').forEach(el=>{
      const parts=el.id.split('-');
      const cid=parts[2];
      const target=charById[cid];
      if(target) el.innerHTML=target.avatar;
    });
  });
}

function closePanel(){
  backdrop.classList.remove('open');
  panel.classList.remove('open');
  document.body.style.overflow='';
}

function toggleSection(header){
  const wrap=header.nextElementSibling;
  const isOpen=wrap.classList.contains('open');
  wrap.classList.toggle('open',!isOpen);
  header.classList.toggle('open',!isOpen);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); });

/* ══ VINYL — état restauré depuis sessionStorage ══ */
const player    =document.getElementById('player');
const vinyl     =document.getElementById('vinyl');
const vinylSvg  =document.getElementById('vinyl-svg');
const coverImg  =document.getElementById('cover-img');
const trackLabel=document.getElementById('track-label');
const trackList =document.getElementById('track-list');
const dropdown  =document.getElementById('dropdown');
const chevronBtn=document.getElementById('chevron-btn');
const iPlay     =document.getElementById('i-play');
const iPause    =document.getElementById('i-pause');
const vinylPopup=document.getElementById('vinyl-popup');

let currentIdx=-1,isPlaying=false,ddOpen=false;

/* Build dropdown */
tracks.forEach((t,i)=>{
  const el=document.createElement('div');
  el.className='track-item';
  el.innerHTML=`<div class="track-thumb"><img src="${t.cover}" alt="${t.title}"></div>
    <div class="track-meta"><div class="track-title">${t.title}</div></div>
    <div class="playing-dot"></div>`;
  el.addEventListener('click',()=>selectTrack(i));
  trackList.appendChild(el);
});

/* Popup */
let popupTimer=setTimeout(()=>{if(currentIdx===-1)vinylPopup.classList.add('visible');},2500);
function hidePopup(){vinylPopup.classList.remove('visible');clearTimeout(popupTimer);}

function selectTrack(idx){
  hidePopup();currentIdx=idx;
  const t=tracks[idx];
  vinylSvg.style.display='none';
  coverImg.src=t.cover;coverImg.style.display='block';
  trackLabel.textContent=t.title;trackLabel.classList.add('on');
  if(t.src){player.src=t.src;player.play().then(()=>setState(true)).catch(()=>setState(true));}
  else{setState(true);}
  document.querySelectorAll('.track-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  closeDropdown();
}
function setState(on){
  isPlaying=on;vinyl.classList.toggle('spinning',on);
  iPlay.style.display=on?'none':'block';iPause.style.display=on?'block':'none';
}
vinyl.addEventListener('click',()=>{
  if(currentIdx===-1){toggleDropdown();return;}
  if(isPlaying){if(tracks[currentIdx].src)player.pause();setState(false);}
  else{if(tracks[currentIdx].src)player.play().catch(()=>{});setState(true);}
});
player.addEventListener('ended',()=>{
  if(tracks.length===1){ player.currentTime=0; player.play().catch(()=>{}); }
  else { selectTrack((currentIdx+1)%tracks.length); }
});

function openDropdown(){ddOpen=true;dropdown.classList.add('open');chevronBtn.classList.add('open');hidePopup();}
function closeDropdown(){ddOpen=false;dropdown.classList.remove('open');chevronBtn.classList.remove('open');}
function toggleDropdown(){ddOpen?closeDropdown():openDropdown();}
chevronBtn.addEventListener('click',e=>{e.stopPropagation();toggleDropdown();});
document.addEventListener('click',e=>{
  if(ddOpen&&!dropdown.contains(e.target)&&!chevronBtn.contains(e.target))closeDropdown();
});

/* ── Restauration sessionStorage ── */
try{
  const saved=JSON.parse(sessionStorage.getItem('aven-player')||'null');
  if(saved&&saved.idx>=0&&saved.idx<tracks.length){
    hidePopup();
    const t=tracks[saved.idx];
    currentIdx=saved.idx;
    vinylSvg.style.display='none';
    coverImg.src=t.cover;coverImg.style.display='block';
    trackLabel.textContent=t.title;trackLabel.classList.add('on');
    document.querySelectorAll('.track-item').forEach((el,i)=>el.classList.toggle('active',i===saved.idx));
    if(t.src&&saved.playing){
      player.src=t.src;
      if(saved.time)player.currentTime=saved.time;
      player.play().then(()=>setState(true)).catch(()=>setState(saved.playing));
    } else {
      setState(saved.playing||false);
    }
  }
}catch(e){}

/* Sauvegarde avant navigation */
window.addEventListener('beforeunload',()=>{
  if(currentIdx>=0){
    sessionStorage.setItem('aven-player',JSON.stringify({
      idx:currentIdx,playing:isPlaying,
      time:tracks[currentIdx].src?player.currentTime:0
    }));
  }
});

/* ── Hamburger responsive ── */
(function(){
  var nav = document.querySelector('nav');
  if(!nav) return;
  // Wrap all <a> inside nav into .nav-links div
  var links = nav.querySelectorAll('a');
  var wrapper = document.createElement('div');
  wrapper.className = 'nav-links';
  links.forEach(function(a){ wrapper.appendChild(a); });
  nav.insertBefore(wrapper, nav.firstChild);
  // Create hamburger
  var ham = document.createElement('div');
  ham.className = 'nav-hamburger fixed';
  ham.setAttribute('aria-label','Menu');
  ham.innerHTML = '<div class="ham-line"></div><div class="ham-line"></div><div class="ham-line"></div>';
  nav.appendChild(ham);
  ham.addEventListener('click', function(){
    ham.classList.toggle('open');
    wrapper.classList.toggle('open');
  });
  // Close on link click
  wrapper.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ ham.classList.remove('open'); wrapper.classList.remove('open'); });
  });
})();

</script>
