<head>
  <meta charset="UTF-8"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>

<body>

<nav>
  <a href="index.html">Accueil</a>
  <a href="personnages.html">Personnages</a>
  <a href="magie.html">Magie</a>
  <a href="univers.html">Univers</a>
  <a href="projet.html">Projet</a>
  <a href="contact.html">Contact</a>
  <div class="vinyl-zone">
    <div class="track-info">
      <span id="track-label">Aucune piste</span>
      <button class="chevron-btn" id="chevron-btn">
        <svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="vinyl" id="vinyl">
      <div class="disc-wrap" id="disc-wrap">
        <svg id="vinyl-svg" class="vinyl-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="50" fill="#111"/>
          <circle cx="50" cy="50" r="47" fill="none" stroke="#1e1e1e" stroke-width=".9"/>
          <circle cx="50" cy="50" r="43" fill="none" stroke="#1e1e1e" stroke-width=".9"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="#1a1a1a" stroke-width=".7"/>
          <circle cx="50" cy="50" r="33" fill="none" stroke="#1e1e1e" stroke-width=".7"/>
          <circle cx="50" cy="50" r="28" fill="none" stroke="#1a1a1a" stroke-width=".6"/>
          <circle cx="50" cy="50" r="23" fill="none" stroke="#1e1e1e" stroke-width=".6"/>
          <ellipse cx="38" cy="30" rx="8" ry="3.5" fill="white" opacity=".04" transform="rotate(-25 38 30)"/>
          <circle cx="50" cy="50" r="19" fill="#180a02"/>
          <circle cx="50" cy="50" r="18.5" fill="none" stroke="rgba(200,120,48,.45)" stroke-width=".7"/>
          <text x="50" y="48" text-anchor="middle" font-family="Cinzel,serif" font-size="5.5" fill="rgba(200,120,48,.85)" letter-spacing=".5">AVEN</text>
          <text x="50" y="55.5" text-anchor="middle" font-family="sans-serif" font-size="2.6" fill="rgba(200,120,48,.4)" letter-spacing=".8">JOURNEY</text>
          <circle cx="50" cy="50" r="3" fill="#0a0a0a"/>
        </svg>
        <img id="cover-img" src="" alt="" style="display:none;border-radius:50%;object-fit:cover;"/>
      </div>
      <div class="vinyl-icon">
        <svg id="i-play" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        <svg id="i-pause" viewBox="0 0 24 24" style="display:none"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
      </div>
    </div>
  </div>
</nav>
<div class="dropdown" id="dropdown">
  <div class="dropdown-header">Pistes</div>
  <div id="track-list"></div>
</div>
<div id="vinyl-popup">
  <div class="popup-dot"></div>
  <span class="popup-text">Lancer une piste</span>
</div>
<audio id="player" preload="metadata"></audio>

<!-- MODAL PANNEAU PERSONNAGE -->


<div class="page">
  <!-- Fond atmosphérique -->
  <div class="page-bg">
    <div class="bg-grad" style="background:linear-gradient(160deg,#04040e 0%,#06081a 20%,#080820 40%,#060610 70%,#040408 100%);"></div>
    <div class="bg-layer bg-r"><div class="bg-grad" style="background:linear-gradient(160deg,#04040e 0%,#06081a 20%,#080820 40%,#060610 70%,#040408 100%);"></div></div>
    <div class="bg-layer bg-b"><div class="bg-grad" style="background:linear-gradient(160deg,#04040e 0%,#06081a 20%,#080820 40%,#060610 70%,#040408 100%);"></div></div>
    <div class="vignette"></div>
    <div class="edge-blur"></div>
  </div>

  <!-- Contenu scrollable -->
  <div class="page-content">
    <h1 class="page-title">Personnages</h1>
    <p class="page-subtitle">The Unwritten Journey</p>
    <div class="filter-bar" id="filter-bar"></div>
    <div id="groups-container"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-backdrop" onclick="closePanel()"></div>
<div id="char-panel">
  <div class="panel-header" style="position:relative;">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-header-top">
      <div class="panel-avatar" id="panel-avatar"></div>
      <div class="panel-header-text">
        <div class="panel-char-name" id="panel-name"></div>
        <div class="panel-char-title" id="panel-title"></div>
      </div>
    </div>
    <div class="panel-char-tags" id="panel-tags"></div>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>

<script src="data/tracks.js"></script>
<script src="data/characters.js"></script>
<script src="js/shared.js"></script>
<script src="js/personnages.js"></script>
</body>
</html>
