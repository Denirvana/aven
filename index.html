<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aven — The Unwritten Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>
  <style>
    html, body { overflow: hidden; }

    .scroll-root {
      width: 100%; height: 100vh;
      overflow-y: scroll; overflow-x: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .scroll-root::-webkit-scrollbar { display: none; }

    section {
      width: 100vw; height: 100vh;
      scroll-snap-align: start;
      position: relative; overflow: hidden;
    }

    /* ── HERO ── */
    .hero { display: flex; align-items: center; justify-content: center; }

    .bg-hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        #03030b 0%,#090618 9%,#150d28 18%,#200f38 27%,
        #341230 37%,#541e1a 47%,#7c3010 57%,
        #b85210 65%,#d67020 72%,#e28a34 78%,
        #c46a1a 86%,#7c381a 93%,#1e0c04 100%);
    }

    .bg-parallax {
      position: absolute; inset: -60px;
      will-change: transform;
    }

    .bg-mountains {
      position: absolute; inset: 0;
      display: flex; align-items: flex-end;
    }

    .bg-mountains svg { width: 100%; height: 100%; }

    .bg-abberation {
      position: absolute; inset: -60px;
      will-change: transform;
      opacity: .65; mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(ellipse 84% 80% at 50% 50%, transparent 38%, rgba(0,0,0,.65) 62%, black 84%);
      mask-image: radial-gradient(ellipse 84% 80% at 50% 50%, transparent 38%, rgba(0,0,0,.65) 62%, black 84%);
      pointer-events: none;
    }

    .logo-text {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(74px, 11.5vw, 136px);
      letter-spacing: 0.28em;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 80px rgba(200,120,48,.42), 0 2px 8px rgba(0,0,0,.55);
    }

    .ornament { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
    .orn-l { height: .5px; width: 56px; background: linear-gradient(to right, transparent, rgba(200,120,48,.52)); }
    .orn-l.r { background: linear-gradient(to left, transparent, rgba(200,120,48,.52)); }
    .orn-d { width: 5px; height: 5px; background: rgba(200,120,48,.72); transform: rotate(45deg); }

    .subtitle {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: clamp(10px, 1.2vw, 13px);
      letter-spacing: 0.46em;
      color: rgba(255,255,255,.42);
      text-transform: uppercase;
      margin-top: 16px;
    }

    .hero-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      margin-top: calc(var(--nav-h) / -2);
      user-select: none;
    }

    .scroll-hint {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
    }

    .scroll-hint span {
      font-family: 'Raleway', sans-serif;
      font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
      color: rgba(255,255,255,.26); transition: color .3s;
    }

    .scroll-hint:hover span { color: rgba(255,255,255,.5); }

    .scroll-line {
      width: 1px; height: 28px;
      background: linear-gradient(to bottom, rgba(255,255,255,.3), transparent);
      animation: aven-line-pulse 2.2s ease-in-out infinite;
    }

    @keyframes aven-line-pulse { 0%,100%{opacity:.3} 50%{opacity:.7} }

    /* ── SECTION 2 ── */
    .discover {
      background: #07070f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: calc(var(--nav-h) + 32px) 48px 40px;
      gap: 16px;
    }

    .section-label {
      font-family: 'Raleway', sans-serif;
      font-weight: 200; font-size: 9px;
      letter-spacing: .32em; text-transform: uppercase;
      color: rgba(255,255,255,.2);
      margin-bottom: 4px; align-self: flex-start;
    }

    .cards-grid {
      width: 100%; max-width: 1000px; flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.1fr .9fr;
      gap: 14px;
    }

    .card {
      position: relative; overflow: hidden; border-radius: 6px;
      cursor: pointer; text-decoration: none;
      border: .5px solid rgba(255,255,255,.06);
      transition: border-color .3s, transform .35s cubic-bezier(.22,1,.36,1);
    }

    .card:hover { border-color: rgba(255,255,255,.14); transform: translateY(-3px); }
    .card-univers { grid-column: 1 / -1; }

    .card-img {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: transform .6s cubic-bezier(.22,1,.36,1), filter .4s;
      filter: brightness(.55) saturate(.8);
    }

    .card:hover .card-img { transform: scale(1.04); filter: brightness(.7) saturate(1); }

    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(4,4,12,.85) 0%, transparent 60%);
    }

    .card-body { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px 20px; }

    .card-tag {
      font-family: 'Raleway', sans-serif;
      font-size: 8px; font-weight: 400;
      letter-spacing: .22em; text-transform: uppercase;
      color: rgba(200,120,48,.8); margin-bottom: 6px;
    }

    .card-name {
      font-family: 'Cinzel', serif; font-weight: 400;
      font-size: clamp(18px, 2.2vw, 28px);
      letter-spacing: .12em; color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }

    .card-univers .card-name { font-size: clamp(22px, 3vw, 38px); }

    @media (max-width: 680px) {
      .cards-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
      .card-univers { grid-column: 1; }
      .discover { padding: calc(var(--nav-h) + 20px) 20px 28px; gap: 12px; }
    }
  </style>
</head>

<script>
(function(){
  var root = document.getElementById('scroll-root');
  var bgM  = document.getElementById('bg-main');
  var bgR  = document.getElementById('bg-r');
  var bgB  = document.getElementById('bg-b');
  var hint = document.getElementById('scroll-hint');

  var tx=0,ty=0,cx=0,cy=0;
  var FORCE=30, SMOOTH=0.055, CA=6;
  var currentSection=0, locked=false;

  document.addEventListener('mousemove', function(e){
    if (currentSection !== 0) return;
    tx = (e.clientX/innerWidth  - 0.5) * FORCE;
    ty = (e.clientY/innerHeight - 0.5) * FORCE;
  });

  (function raf(){
    cx += (tx-cx)*SMOOTH; cy += (ty-cy)*SMOOTH;
    var sc = 'scale(1.08)';
    bgM.style.transform = 'translate('+cx+'px,'+cy+'px) '+sc;
    bgR.style.transform = 'translate('+(cx-CA)+'px,'+(cy-2)+'px) '+sc;
    bgB.style.transform = 'translate('+(cx+CA)+'px,'+(cy+2)+'px) '+sc;
    requestAnimationFrame(raf);
  })();

  function goSection(idx){
    idx = Math.max(0,Math.min(1,idx));
    if(idx===currentSection||locked) return;
    locked=true; currentSection=idx;
    root.scrollTo({top:idx*root.clientHeight,behavior:'smooth'});
    if(idx>0){tx=0;ty=0;}
    setTimeout(function(){locked=false;},900);
  }

  var wd=0, wt=null;
  root.addEventListener('wheel',function(e){
    e.preventDefault();
    wd+=e.deltaY;
    clearTimeout(wt);
    wt=setTimeout(function(){
      if(Math.abs(wd)>20) goSection(currentSection+(wd>0?1:-1));
      wd=0;
    },60);
  },{passive:false});

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'||e.key==='PageDown') goSection(currentSection+1);
    if(e.key==='ArrowUp'  ||e.key==='PageUp'  ) goSection(currentSection-1);
  });

  hint.addEventListener('click',function(){ goSection(1); });
})();
</script>
