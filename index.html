  <style>*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --nav-h:56px; }
    html, body { width:100%; height:100%; overflow:hidden; background:#06060f; }
    .svg-defs { position:absolute; width:0; height:0; overflow:hidden; }

    /* ══ SCROLL ROOT ══════════════════════════════════
       scroll-behavior: smooth → le navigateur anime
       le scrollTo() avec son propre easing fluide.
       scroll-snap-type: y mandatory → ancrage aux sections
       Les deux ensemble donnent un scroll smooth + magnétique.
    ═════════════════════════════════════════════════ */
    .scroll-root {
      width:100%; height:100vh;
      overflow-y:scroll; overflow-x:hidden;
      scroll-behavior:smooth;
      scroll-snap-type:y mandatory;
      scrollbar-width:none;
    }
    .scroll-root::-webkit-scrollbar { display:none; }

    section {
      width:100vw; height:100vh;
      scroll-snap-align:start;
      position:relative; overflow:hidden;
    }

    
    
    /* ══ DISQUE ══ */
    .vinyl { position:relative; width:40px; height:40px; cursor:pointer; flex-shrink:0; }
    .disc-wrap {
      width:40px; height:40px; border-radius:50%; overflow:hidden;
      transform-origin:center;
      animation:spin 4s linear infinite;
      animation-play-state:paused;
      transition:box-shadow .5s;
    }
    .vinyl.spinning .disc-wrap {
      animation-play-state:running;
      box-shadow:0 0 10px rgba(200,120,48,.5);
    } }
    .disc-wrap img, .disc-wrap svg.vinyl-svg { width:40px; height:40px; display:block; }
    .vinyl-icon {
      position:absolute; inset:0; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.45); opacity:0; transition:opacity .2s;
    }
    .vinyl:hover .vinyl-icon { opacity:1; }
    .vinyl-icon svg { width:13px; height:13px; fill:rgba(255,255,255,.92); }

    
    
    /* ══ SECTION 1 — HERO ══ */
    .hero { display:flex; align-items:center; justify-content:center; }
    .bg { position:absolute; inset:-60px; will-change:transform; }
    .bg-gradient {
      position:absolute; inset:0;
      background:linear-gradient(to bottom,
        #03030b 0%,#090618 9%,#150d28 18%,#200f38 27%,
        #341230 37%,#541e1a 47%,#7c3010 57%,
        #b85210 65%,#d67020 72%,#e28a34 78%,
        #c46a1a 86%,#7c381a 93%,#1e0c04 100%);
    }
    .bg-shape { position:absolute; inset:0; display:flex; align-items:flex-end; }
    .bg-shape svg { width:100%; height:100%; }
    .bg-r, .bg-b {
      position:absolute; inset:-60px; will-change:transform; pointer-events:none;
      opacity:.7; mix-blend-mode:screen;
      -webkit-mask-image:radial-gradient(ellipse 84% 80% at 50% 50%, transparent 38%, rgba(0,0,0,.65) 62%, black 84%);
      mask-image:        radial-gradient(ellipse 84% 80% at 50% 50%, transparent 38%, rgba(0,0,0,.65) 62%, black 84%);
    }
    .bg-r { filter:url(#ca-red); }
    .bg-b { filter:url(#ca-blue); }
    .bg-r .bg-gradient, .bg-b .bg-gradient {
      position:absolute; inset:0;
      background:linear-gradient(to bottom,
        #03030b 0%,#090618 9%,#150d28 18%,#200f38 27%,
        #341230 37%,#541e1a 47%,#7c3010 57%,
        #b85210 65%,#d67020 72%,#e28a34 78%,
        #c46a1a 86%,#7c381a 93%,#1e0c04 100%);
    }
    .bg-r .bg-shape, .bg-b .bg-shape { position:absolute; inset:0; display:flex; align-items:flex-end; }
    .bg-r .bg-shape svg, .bg-b .bg-shape svg { width:100%; height:100%; }
    .vignette {
      position:absolute; inset:0; z-index:3; pointer-events:none;
      background:radial-gradient(ellipse 68% 64% at 50% 48%, transparent 28%, rgba(3,3,11,.62) 62%, rgba(3,3,11,.94) 100%);
    }
    .edge-blur {
      position:absolute; inset:0; z-index:4; pointer-events:none;
      backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
      -webkit-mask-image:radial-gradient(ellipse 70% 66% at 50% 48%, transparent 34%, rgba(0,0,0,.55) 54%, black 76%);
      mask-image:        radial-gradient(ellipse 70% 66% at 50% 48%, transparent 34%, rgba(0,0,0,.55) 54%, black 76%);
    }
    .noise {
      position:absolute; inset:0; z-index:5; pointer-events:none; opacity:.03;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:180px;
    }
    .hero-content {
      position:relative; z-index:10;
      display:flex; flex-direction:column; align-items:center; text-align:center;
      margin-top:calc(var(--nav-h) / -2); user-select:none;
      opacity:0; transform:translateY(14px);
      animation:fadeUp 1.4s cubic-bezier(.22,1,.36,1) .4s forwards;
    }
    .logo-text {
      font-family:'Cinzel',serif; font-weight:700;
      font-size:clamp(74px,11.5vw,136px); letter-spacing:.28em; color:#fff; line-height:1;
      text-shadow:0 0 80px rgba(200,120,48,.42),0 0 160px rgba(200,120,48,.14),0 2px 8px rgba(0,0,0,.55);
    }
    .ornament { display:flex; align-items:center; gap:14px; margin-top:10px; }
    .orn-l { height:.5px; width:56px; background:linear-gradient(to right,transparent,rgba(200,120,48,.52)); }
    .orn-l.r { background:linear-gradient(to left,transparent,rgba(200,120,48,.52)); }
    .orn-d { width:5px; height:5px; background:rgba(200,120,48,.72); transform:rotate(45deg); }
    .subtitle {
      font-family:'Raleway',sans-serif; font-weight:200;
      font-size:clamp(10px,1.2vw,13px); letter-spacing:.46em;
      color:rgba(255,255,255,.42); text-transform:uppercase; margin-top:16px;
    }
    .scroll-hint {
      position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
      z-index:10; display:flex; flex-direction:column; align-items:center; gap:8px;
      cursor:pointer; opacity:0; animation:fadeUp 1s ease 2.2s forwards;
    }
    .scroll-hint span {
      font-family:'Raleway',sans-serif; font-size:9px;
      letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.26); transition:color .3s;
    }
    .scroll-hint:hover span { color:rgba(255,255,255,.5); }
    .scroll-line {
      width:1px; height:28px;
      background:linear-gradient(to bottom,rgba(255,255,255,.3),transparent);
      animation:pulse 2.2s ease-in-out infinite;
    }

    /* ══ SECTION 2 — DÉCOUVRIR ══ */
    .discover {
      background:#07070f;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:calc(var(--nav-h) + 32px) 48px 40px; gap:16px;
    }
    .section-label {
      font-family:'Raleway',sans-serif; font-weight:200;
      font-size:9px; letter-spacing:.35em; text-transform:uppercase;
      color:rgba(255,255,255,.22); margin-bottom:4px; align-self:flex-start;
    }
    .cards-grid {
      width:100%; max-width:1000px; flex:1;
      display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1.1fr .9fr; gap:14px;
    }
    .card {
      position:relative; overflow:hidden; border-radius:6px;
      cursor:pointer; text-decoration:none;
      border:.5px solid rgba(255,255,255,.06);
      transition:border-color .3s, transform .35s cubic-bezier(.22,1,.36,1);
    }
    .card:hover { border-color:rgba(255,255,255,.14); transform:translateY(-3px); }
    .card-univers { grid-column:1 / -1; }
    .card-img {
      position:absolute; inset:0; background-size:cover; background-position:center;
      transition:transform .6s cubic-bezier(.22,1,.36,1), filter .4s;
      filter:brightness(.55) saturate(.8);
    }
    .card:hover .card-img { transform:scale(1.04); filter:brightness(.7) saturate(1); }
    .card-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top,rgba(4,4,12,.85) 0%,transparent 60%);
    }
    .card-body { position:absolute; bottom:0; left:0; right:0; padding:18px 20px; }
    .card-tag {
      font-family:'Raleway',sans-serif; font-size:8px; font-weight:400;

      text-shadow:0 2px 12px rgba(0,0,0,.6);
    }
    .card-univers .card-name { font-size:clamp(22px,3vw,38px); }

<script>/* ══ DOM ══ */

function hidePopup(){ vinylPopup.classList.remove('visible'); clearTimeout(popupTimer); }

/* ── Sélection piste ── */
function selectTrack(idx){
  hidePopup();
  currentIdx=idx;
  const t=tracks[idx];
  vinylSvg.style.display='none';
  coverImg.src=t.cover; coverImg.style.display='block';
  trackLabel.textContent=t.title; trackLabel.classList.add('on');
  if(t.src){ player.src=t.src; player.play().then(()=>setState(true)).catch(()=>setState(true)); }
  else{ setState(true); }
  document.querySelectorAll('.track-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  closeDropdown();
}

function setState(on){
  isPlaying=on;
  vinyl.classList.toggle('spinning',on);
  iPlay.style.display =on?'none' :'block';
  iPause.style.display=on?'block':'none';
}

vinyl.addEventListener('click',()=>{
  if(currentIdx===-1){toggleDropdown();return;}
  if(isPlaying){ if(tracks[currentIdx].src) player.pause(); setState(false); }
  else         { if(tracks[currentIdx].src) player.play().catch(()=>{}); setState(true); }
});
player.addEventListener('ended',()=>{
  if(tracks.length===1){ player.currentTime=0; player.play().catch(()=>{}); }
  else { selectTrack((currentIdx+1)%tracks.length); }
});

/* ── Dropdown ── */
function openDropdown() { ddOpen=true;  dropdown.classList.add('open');    chevronBtn.classList.add('open');    hidePopup(); }
function closeDropdown(){ ddOpen=false; dropdown.classList.remove('open'); chevronBtn.classList.remove('open'); }
function toggleDropdown(){ ddOpen?closeDropdown():openDropdown(); }
chevronBtn.addEventListener('click',e=>{e.stopPropagation();toggleDropdown();});
document.addEventListener('click',e=>{
  if(ddOpen&&!dropdown.contains(e.target)&&!chevronBtn.contains(e.target)) closeDropdown();
});

/* ══ SCROLL SMOOTH + SNAP ════════════════════════════════════════════════
   On laisse CSS scroll-snap gérer l'ancrage.
   On intercale juste un debounce sur la molette pour que chaque coup
   de roue = exactement un changement de section, proprement animé
   par scroll-behavior:smooth du navigateur (easing natif = très fluide).
══════════════════════════════════════════════════════════════════════════ */
const SECTIONS=2;

function goTo(idx){
  idx=Math.max(0,Math.min(SECTIONS-1,idx));
  if(idx===currentSection||scrollLocked) return;
  scrollLocked=true;
  currentSection=idx;
  scrollRoot.scrollTo({top:idx*scrollRoot.clientHeight,behavior:'smooth'});
  /* Le smooth scroll natif dure ~500-800ms selon le navigateur */
  setTimeout(()=>{ scrollLocked=false; },900);
  /* Stoppe le parallax en section 2 */
  if(idx>0){tx=0;ty=0;}
}

/* Molette : un tick = une section */
let wheelDelta=0, wheelTimer=null;
scrollRoot.addEventListener('wheel',e=>{
  e.preventDefault();
  wheelDelta+=e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer=setTimeout(()=>{
    if(Math.abs(wheelDelta)>20) goTo(currentSection+(wheelDelta>0?1:-1));
    wheelDelta=0;
  },60);
},{passive:false});

/* Clavier */
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown') goTo(currentSection+1);
  if(e.key==='ArrowUp'  ||e.key==='PageUp'  ) goTo(currentSection-1);
});

/* Bouton Découvrir */
scrollHint.addEventListener('click',()=>goTo(1));

/* ══ PARALLAX ════════════════════════════════════════════════════════════ */
const bg=document.getElementById('bg');
const bgR=document.getElementById('bg-r');
const bgB=document.getElementById('bg-b');
const FORCE=32,SMOOTH=0.055,CA_OFF=6;
let tx=0,ty=0,cx=0,cy=0;

document.addEventListener('mousemove',e=>{
  if(currentSection!==0) return;
  tx=(e.clientX/innerWidth -.5)*FORCE;
  ty=(e.clientY/innerHeight-.5)*FORCE;
});

(function raf(){
  cx+=(tx-cx)*SMOOTH; cy+=(ty-cy)*SMOOTH;
  const sc='scale(1.08)';
  bg.style.transform =`translate(${cx}px,${cy}px) ${sc}`;
  bgR.style.transform=`translate(${cx-CA_OFF}px,${cy-2}px) ${sc}`;
  bgB.style.transform=`translate(${cx+CA_OFF}px,${cy+2}px) ${sc}`;
  requestAnimationFrame(raf);
})();

/* Sauvegarde état audio avant navigation */</script>
